<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マーカー認識 VRM AR (Safari対応)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        #info {
            position: absolute; top: 10px; width: 90%; left: 5%;
            text-align: center; color: white; font-family: sans-serif;
            font-size: 14px; background: rgba(0, 0, 0, 0.6);
            padding: 8px; border-radius: 8px; pointer-events: none; z-index: 100;
        }
    </style>
    <!-- Three.jsとVRMライブラリの読み込み -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="info">初期化中...（カメラへのアクセスを許可してください）</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const infoElement = document.getElementById('info');
        
        // AR.jsはグローバルなTHREEオブジェクトを必要とするため紐付けます
        window.THREE = THREE; 

        // AR.jsを動的に読み込み（THREEの準備が完了した後にロードする）
        const script = document.createElement('script');
        script.src = "https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar.js";
        script.onload = () => {
            initAR();
        };
        document.head.appendChild(script);

        let camera, scene, renderer;
        let arToolkitSource, arToolkitContext, markerRoot;
        let currentVrm = null;
        const clock = new THREE.Clock();

        function initAR() {
            scene = new THREE.Scene();

            // AR.js用のカメラ設定（通常のカメラとは異なります）
            camera = new THREE.Camera();
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 描画領域を画面全体に設定
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0px';
            renderer.domElement.style.left = '0px';
            document.body.appendChild(renderer.domElement);

            // 照明の設定（トゥーンシェーダーが綺麗に出るように）
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2);
            scene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            // --- AR.jsの設定 ---
            arToolkitSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam'
            });

            arToolkitSource.init(function onReady() {
                // カメラのリサイズ処理（少し待ってから実行すると安定します）
                setTimeout(onResize, 1000);
            });

            window.addEventListener('resize', onResize);

            function onResize() {
                arToolkitSource.onResizeElement();
                arToolkitSource.copyElementSizeTo(renderer.domElement);
                if (arToolkitContext.arController !== null) {
                    arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
                }
            }

            arToolkitContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat',
                detectionMode: 'mono'
            });

            arToolkitContext.init(function onCompleted() {
                camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
            });

            // マーカーを検知した際の基準となるグループ（この上にキャラを乗せる）
            markerRoot = new THREE.Group();
            scene.add(markerRoot);
            
            // 「Hiro」マーカー（定番のARマーカー）を使用
            new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
                type: 'pattern',
                patternUrl: 'https://raw.githack.com/AR-js-org/AR.js/master/data/data/patt.hiro'
            });

            infoElement.innerText = "VRMファイルを読み込み中...";

            // --- VRMの読み込み ---
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));
            
            loader.load(
                './avatar.vrm', 
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    VRMUtils.rotateVRM0(vrm);
                    
                    // マーカーサイズに合わせてモデルの大きさを調整（高さ約1.2倍）
                    const box = new THREE.Box3().setFromObject(vrm.scene);
                    const size = box.getSize(new THREE.Vector3());
                    const scale = 1.2 / size.y;
                    vrm.scene.scale.set(scale, scale, scale);
                    
                    // カメラの方を向かせる
                    vrm.scene.rotation.y = Math.PI; 

                    currentVrm = vrm;
                    // マーカーグループにVRMを追加
                    markerRoot.add(vrm.scene);
                    
                    infoElement.innerText = "準備完了！「Hiroマーカー」をカメラに映してください";
                },
                (progress) => {
                    if(progress.total > 0) {
                        const percent = Math.floor((progress.loaded / progress.total) * 100);
                        infoElement.innerText = `読み込み中... ${percent}%`;
                    }
                },
                (error) => {
                    console.error(error);
                    infoElement.innerText = "エラー: VRMファイルが読み込めませんでした";
                }
            );

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // カメラ映像の更新
            if (arToolkitSource.ready !== false) {
                arToolkitContext.update(arToolkitSource.domElement);
            }

            // VRMの揺れモノ処理の更新
            if (currentVrm) {
                currentVrm.update(clock.getDelta());
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
