<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像認識AR (テスト版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        #info {
            position: absolute; top: 10px; width: 90%; left: 5%;
            text-align: center; color: white; font-family: sans-serif;
            font-size: 14px; background: rgba(0, 0, 0, 0.7);
            padding: 10px; border-radius: 8px; pointer-events: none; z-index: 100;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="info">エンジン起動中...（カメラの許可をお願いします）</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { MindARThree } from 'mindar-image-three';

        const infoElement = document.getElementById('info');
        let currentVrm = null;
        const clock = new THREE.Clock();

        async function start() {
            try {
                const mindarThree = new MindARThree({
                    container: document.body,
                    imageTargetSrc: "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/targets.mind",
                });

                const { renderer, scene, camera } = mindarThree;

                const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2);
                scene.add(light);
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
                dirLight.position.set(1, 2, 1);
                scene.add(dirLight);

                const anchor = mindarThree.addAnchor(0);

                // ★ 画像を認識したかどうかのイベントを追加
                anchor.onTargetFound = () => {
                    infoElement.innerHTML = "<span style='color:lime;'>画像認識に成功！</span>（モデルは見えますか？）";
                };
                anchor.onTargetLost = () => {
                    infoElement.innerHTML = "画像を探索中...（アライグマのカードを映してください）";
                };

                // ★ テスト用の赤い箱を追加（VRMが見えなくてもこれが表示されれば認識機能は正常）
                const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.y = 0.25; // 画像の上に少し浮かせる
                anchor.group.add(cube);

                infoElement.innerText = "VRMファイルを読み込み中...";

                const loader = new GLTFLoader();
                loader.register((parser) => new VRMLoaderPlugin(parser));
                
                loader.load(
                    './avatar.vrm', 
                    (gltf) => {
                        const vrm = gltf.userData.vrm;
                        VRMUtils.rotateVRM0(vrm);
                        
                        const box = new THREE.Box3().setFromObject(vrm.scene);
                        const size = box.getSize(new THREE.Vector3());
                        const scale = 1.0 / size.y; 
                        vrm.scene.scale.set(scale, scale, scale);
                        vrm.scene.rotation.x = Math.PI / 2; 

                        currentVrm = vrm;
                        anchor.group.add(vrm.scene);
                        
                        infoElement.innerHTML = "準備完了！<br>アライグマのカードを映してください";
                    }
                );

                await mindarThree.start();

                renderer.setAnimationLoop(() => {
                    if (currentVrm) {
                        currentVrm.update(clock.getDelta());
                    }
                    renderer.render(scene, camera);
                });

            } catch (e) {
                infoElement.innerText = `起動エラー: ${e.message}`;
            }
        }

        start();
    </script>
</body>
</html>
