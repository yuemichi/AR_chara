<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM空間認識AR (最終調整版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        #info {
            position: absolute; top: 10px; width: 90%; left: 5%;
            text-align: center; color: white; font-family: sans-serif;
            font-size: 14px; background: rgba(0, 0, 0, 0.6);
            padding: 8px; border-radius: 8px; pointer-events: none; z-index: 100;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="info">初期化中...</div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const infoElement = document.getElementById('info');
        let camera, scene, renderer, reticle;
        let currentVrm = null;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        const clock = new THREE.Clock();

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // ライティングを少し明るめに調整
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            // レンダラー設定
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            infoElement.innerText = "VRMファイルを読み込み中...";
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));
            
            loader.load(
                './avatar.vrm', 
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    VRMUtils.rotateVRM0(vrm);
                    
                    // ★強制的に大きさを統一（大きすぎる/小さすぎる問題の回避）
                    // 一旦スケールを1にし、モデルの中心を足元に合わせます
                    const box = new THREE.Box3().setFromObject(vrm.scene);
                    const size = box.getSize(new THREE.Vector3());
                    // モデルの高さが1mになるようにスケールを調整
                    const scale = 1.0 / size.y;
                    vrm.scene.scale.set(scale, scale, scale);

                    currentVrm = vrm;
                    vrm.scene.visible = false;
                    scene.add(vrm.scene);
                    infoElement.innerText = "読み込み完了！緑の円が出たら画面をタップしてください";
                },
                undefined,
                (error) => {
                    console.error(error);
                    infoElement.innerText = "エラー詳細: " + (error.message || "不明なエラー");
                }
            );

            // タップ処理 (標準のWebXR用)
            const controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // ★タップ処理の予備 (WebXR Viewerでタップが認識されないバグの回避用)
            window.addEventListener('touchstart', (e) => {
                // ボタンなどを押した時は反応させない
                if (e.target.tagName !== 'CANVAS') return;
                onSelect();
            });

            // 床認識マーカー
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x00ff00 })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onSelect() {
            if (!currentVrm) {
                infoElement.innerText = "モデルの読み込みが完了していません。";
                return;
            }

            if (reticle.visible && currentVrm) {
                // マーカーの位置に移動
                currentVrm.scene.position.setFromMatrixPosition(reticle.matrix);
                currentVrm.scene.visible = true;
                
                // カメラの方向へ向かせる
                const targetPos = new THREE.Vector3(camera.position.x, currentVrm.scene.position.y, camera.position.z);
                currentVrm.scene.lookAt(targetPos);
                // 正面を向かせるための補正
                currentVrm.scene.rotation.y += Math.PI; 
                
                infoElement.innerText = "キャラクターを配置しました！";
            } else if (!reticle.visible) {
                infoElement.innerText = "緑の円（マーカー）が床に出ている時にタップしてください";
            }
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            const deltaTime = clock.getDelta();
            
            if (currentVrm) {
                currentVrm.update(deltaTime);
            }

            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        session.requestHitTestSource({ space: refSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
