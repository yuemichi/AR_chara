<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR.js 動作テスト(赤い箱)</title>
    <!-- A-FrameとAR.jsの読み込み -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
    <div style="position: absolute; top: 10px; width: 100%; text-align: center; z-index: 100; color: black; background: rgba(255,255,255,0.8); padding: 10px; font-family: sans-serif;">
        【テスト】Hiroマーカーの上に「赤い箱」が出ますか？
    </div>

    <!-- 空間の設定（VRボタンなどを非表示にし、Webカメラを指定） -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <!-- Hiroマーカーを認識した時の処理 -->
        <a-marker preset="hiro">
            <!-- 赤い箱を配置する -->
            <a-box position="0 0.5 0" color="red"></a-box>
        </a-marker>
        
        <!-- AR用のカメラ -->
        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
