<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhoneネイティブAR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #333; height: 100vh; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- ios-srcに変換したUSDZを指定 -->
    <model-viewer 
        src="./avatar.glb" 
        ios-src="./avatar.usdz" 
        ar 
        camera-controls 
        auto-rotate>
    </model-viewer>
</body>
</html>
